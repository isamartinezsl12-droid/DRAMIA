name: Construir DRAMIA APK

on:
  workflow_dispatch:
  push:
    branches: ["principal", "main"]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar proyecto
        uses: actions/checkout@v6

      - name: Configurar Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Configurar Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: "platforms;android-35 build-tools;35.0.0"

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "8.10.2"

      - name: Extraer DRAMIA
        run: |
          unzip -q DRAMIA_V1.zip -d proyecto
          echo "Contenido:"
          find proyecto -maxdepth 3 -type f | head -50

      - name: Construir APK
        run: |
          cd proyecto/DRAMIA_V1
          gradle :app:assembleDebug --stacktrace

      - name: Guardar APK
        uses: actions/upload-artifact@v4
        with:
          name: DRAMIA-APK
          path: proyecto/DRAMIA_V1/app/build/outputs/apk/debug/app-debug.apk
